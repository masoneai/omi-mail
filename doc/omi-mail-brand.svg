<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Omi Mail</title>
  <desc id="desc">Omi Mail's O monogram, an envelope fold and a gold postmark, on a warm white background.</desc>
  <rect width="640" height="240" rx="32" fill="#F7F5ED"/>
  <g transform="translate(56 68) scale(1.625)">
    <rect width="64" height="64" rx="20" fill="#153B3C"/>
    <circle cx="32" cy="32" r="18" stroke="#F7F4E8" stroke-width="5"/>
    <path d="M22 28.5 32 36l10-7.5" stroke="#BCE9D9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="47.5" cy="20" r="5.5" fill="#DBB76B" stroke="#153B3C" stroke-width="2.5"/>
  </g>
  <text x="196" y="128" fill="#153B3C" font-family="Inter, Helvetica, Arial, sans-serif" font-size="60" font-weight="650" letter-spacing="-2">Omi Mail</text>
  <text x="200" y="168" fill="#647E74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2">MAKE ROOM FOR YOUR MAIL.</text>
