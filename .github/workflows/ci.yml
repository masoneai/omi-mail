name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Worker tests and Vue build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mail-worker

      - name: Run worker tests
        run: pnpm test
        working-directory: mail-worker

      - name: Install Vue dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mail-vue

      - name: Build Vue application
        run: pnpm run build
        working-directory: mail-vue
